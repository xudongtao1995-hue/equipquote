[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipquote"
version = "0.1.0"
description = "Industrial equipment quotation generator for SME B2B sales engineers, with VAT calculation and RMB amount-in-words."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Xu Dongtao" }]
keywords = ["quotation", "invoice", "b2b-sales", "industrial-equipment", "china-vat", "rmb"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.scripts]
equipquote = "equipquote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
